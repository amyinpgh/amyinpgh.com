<!DOCTYPE html>
<html lang="en">

	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>amyinpgh.com — Coming Soon</title>
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Momo+Trust+Display&family=Lora:ital,wght@0,400..600;1,400..600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
		<style>
			:root {
				--maroon-deep: #4A0E17;
				--maroon-main: #bb2548;
				--maroon-rich: #800020;
				--maroon-light: #9E2A3B;
				--cream-bg: #FDFBF7;
				--cream-dark: #a19c92;
				--cream-card: #FAF4EE;
				--text-dark: #2B1216;
				--text-muted: #6E5358;
			}

			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}

			body {
				background-color: var(--cream-bg);
				color: var(--text-dark);
				font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
				min-height: 100vh;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 2rem 1rem;
				background-image:
					radial-gradient(var(--maroon-light) 0.75px, transparent 0.75px);
				background-size: 24px 24px;
				background-position: 0 0;
			}

			.container {
				max-width: 500px;
				width: 100%;
				background: var(--cream-card);
				border: 3px solid var(--cream-dark);
				border-radius: 8px;
				padding: 3rem 2.5rem;
				box-shadow: 0 12px 28px rgba(74, 14, 23, 0.08);
				text-align: center;
			}

			h1 {
				font-family: "Momo Trust Display", sans-serif;
				font-size: 2rem;
				color: var(--maroon-main);
				margin-bottom: 1.25rem;
				line-height: 1.3;
			}

			p {
				display: inline-block;
				background-color: var(--maroon-deep);
				color: #FFFFFF;
				font-size: 0.75rem;
				font-weight: 600;
				letter-spacing: 0.1em;
				text-transform: uppercase;
				padding: 0.35rem 0.85rem;
				border-radius: 4px;
				margin-bottom: 0;
			}


			@media (max-width: 480px) {
				.container {
					padding: 2rem 1.5rem;
				}

				h1 {
					font-size: 1.6rem;
				}

				p {
					font-size: 0.95rem;
				}
			}
		</style>
	</head>

	<body>
		<main class="container">
			<h1>amyinpgh.com</h1>
			<p>Coming Soon</p>
		</main>
	</body>

</html>
